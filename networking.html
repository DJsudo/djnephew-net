<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Story from the Fireline – D.J. Nephew</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">

  <style>
    :root {
      --bg: #f8fafc;
      --text: #1e293b;
      --accent: #2563eb;
      --card: #eef2ff;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --card: #1e293b;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text);
      opacity: 0.6;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    article p {
      line-height: 1.75;
      margin-bottom: 1.35rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Navigation Bar */
    .nav {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 2rem;
      background: var(--card);
      border-bottom: 1px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    /* Dark Mode Toggle */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--card);
      border: 1px solid var(--accent);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      z-index: 200;
    }
  </style>
</head>

<body>

  <div class="theme-toggle" onclick="toggleTheme()">Toggle Theme</div>
  
  <!-- Navigation -->
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/resume.html">Résumé</a>
    <a href="/projects.html">Projects</a>
    <a href="/contact.html">Contact</a>
  </nav>
  
  <main class="container">
    <h1>A Story from the Fireline</h1>
    <div class="subtitle">A personal narrative, written in 2004</div>

    <article>
      <p>
          Networking stories and lessons here.

        
      </p>
    </article>

    <p>
    <a href="/projects.html" class="back-link">  ← Back to Projects </a>
    </p>
    
  </main>

  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    }
  </script>

</body>
</html>
